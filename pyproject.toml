[project]
name = "ecommerce-product-rag-evals"
version = "0.1.0"
description = "Synthetic e-commerce support RAG pipeline with a RAGAS evaluation gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Muhammad Mustafa" }]
keywords = ["rag", "ragas", "llm-evaluation", "ecommerce"]
dependencies = [
  "faiss-cpu>=1.9.0",
  # ragas 0.4.3 imports langchain_community.chat_models.vertexai, removed in 0.4.2.
  "langchain-community==0.4.1",
  "numpy>=2.1.0",
  "openai>=1.54.0",
  "psycopg[binary]>=3.2.0",
  "ragas==0.4.3",
  "rapidfuzz>=3.10.0",
]

[project.scripts]
northline-ask = "northline_rag.ask:main"
northline-eval = "northline_rag.evaluation.cli:main"
northline-index-pg = "northline_rag.index_pg:main"

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northline_rag"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["northline_rag"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["faiss", "psycopg", "psycopg.*", "ragas", "ragas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
