name: live-eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check for OPENAI_API_KEY
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not set. Live eval did not run."
          fi
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: uv sync --frozen
      - name: Live eval gate
        if: steps.key.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: uv run python -m northline_rag.evaluation.cli live
